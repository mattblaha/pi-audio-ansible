---
- name: Configure raspbian instance as remote speaker
  hosts: all
  become: true

  vars:
    hostname: "{{ hostvars[inventory_hostname].hostname }}"
    desired_timezone: "{{ hostvars[inventory_hostname].timezone |default('America/Chicago') }}"

  tasks:
  # the hostname is used by shairport and PulseAudio to advertise
  # themselves on your network
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ hostname }}"
      register: set_hostname

  # because the filter is activated on a schedule, the timezone
  # matters a lot
    - name: Get current timezone
      ansible.builtin.command:
        cmd: timedatectl show --property=Timezone --value
      register: tz_current
      changed_when: false
      check_mode: false

    - name: Set timezone if it differs from desired
      ansible.builtin.command:
        cmd: timedatectl set-timezone {{ desired_timezone }}
      when: tz_current.stdout | trim != desired_timezone
      changed_when: true


    - name: Configure ALSA
      ansible.builtin.copy:
        src: config/asound.conf
        dest: /etc/asound.conf
        owner: root
        group: root
        mode: "0644"

    - name: Remove PulseAudio Packages
      ansible.builtin.apt:
        name:
          - pulseaudio
          - pulseaudio-module-zeroconf
        state: absent

    - name: Install Packages
      ansible.builtin.apt:
        name:
          - shairport-sync
          - pipewire
          - wireplumber
          - pipewire-pulse
          - swh-plugins
          - libspa-0.2-modules
          - calf-plugins

    - name: Give users access to PipeWire
      ansible.builtin.user:
        name: "{{ item }}"
        groups:
          - pipewire
        append: true
      loop:
        - shairport-sync
        - pi

    - name: Disable per-user PipeWire
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        masked: true
        scope: global
      loop:
        - pipewire.socket
        - pipewire
        - pipewire-pulse.socket
        - pipewire-pulse
        - wireplumber

    - name: Create /etc/pulse
      ansible.builtin.file:
        path: /etc/pulse
        state: directory
        mode: "0755"

    - name: Configure PulseAudio clients
      ansible.builtin.copy:
        src: config/client.conf
        dest: /etc/pulse/client.conf
        owner: root
        group: root
        mode: "0644"

    - name: Create pipewire .conf.d dirs
      ansible.builtin.file:
        path: /etc/pipewire/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - pipewire-pulse.conf.d
        - pipewire.conf.d

    - name: Create pipewire .conf.d dirs
      ansible.builtin.file:
        path: /etc/wireplumber/wireplumber.conf.d
        state: directory
        mode: "0755"

    - name: Set default volume
      ansible.builtin.copy:
        src: config/50-volume.conf
        dest: /etc/wireplumber/wireplumber.conf.d/50-volume.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart wireplumber

    - name: Configure PulseAudio
      ansible.builtin.copy:
        src: config/pipewire-pulse.conf
        dest: /etc/pipewire/pipewire-pulse.conf.d/listen.conf
        owner: root
        group: root
        mode: "0644"
      register: pulseconf

    - name: Add systemd Units
      ansible.builtin.copy:
        src: "config/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - pipewire-system.socket
        - pipewire-system.service
        - pipewire-pulse-system.socket
        - pipewire-pulse-system.service
        - wireplumber-system.service
        - pipewire-filter-chain.service

    - name: Make sure WirePlumber services are running
      ansible.builtin.systemd:
        state: "{{ set_hostname.changed or pulseconf.changed | ternary('restarted', 'started') }}"
        enabled: true
        name: "{{ item }}"
        daemon_reload: true
      loop:
        - pipewire-system.socket
        - pipewire-system.service
        - pipewire-pulse-system.socket
        - pipewire-pulse-system.service
        - wireplumber-system.service

    - name: Dump sinks as JSON
      ansible.builtin.command:
        argv: [pactl, -f, json, list, sinks]
      register: sinks
      changed_when: false
      check_mode: false
      retries: 10
      delay: 2
      until: sinks.rc == 0

    - name: Collect sinks whose device.api is alsa
      ansible.builtin.set_fact:
        _alsa: >-
          {%- set out = [] -%}
          {%- for s in sinks.stdout | from_json -%}
          {%- if s.properties is defined and s.properties['device.api'] | default('') == 'alsa' -%}
          {%- set _ = out.append(s.name) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Use first ALSA device as PipeWire default
      ansible.builtin.set_fact:
        pipewire_output_node: "{{ _alsa | first }}"
      when: pipewire_output_node is not defined

    - name: Configure shairport-sync
      ansible.builtin.copy:
        src: config/shairport-sync.conf
        dest: /etc/shairport-sync.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart shairport-sync

    - name: Create /etc/pipewire/filter-chain.conf.d
      ansible.builtin.file:
        path: /etc/pulse
        state: directory
        mode: "0755"

    - name: Configure PipeWire night filter
      ansible.builtin.template:
        src: templates/50-night-normalize.conf.j2
        dest: /etc/pipewire/filter-chain.conf.d/filter-chain.conf
        owner: root
        group: root
        mode: "0644"
      register: plumbconf
      notify: Restart pipewire filter chain

    - name: Make sure WirePlumber filter chain is running
      ansible.builtin.systemd:
        state: "{{ set_hostname.changed or pulseconf.changed | ternary('restarted', 'started') }}"
        enabled: true
        name: "pipewire-filter-chain"
        daemon_reload: true

    - name: Create directory shairport-sync override
      ansible.builtin.file:
        path: /etc/systemd/system/shairport-sync.service.d
        state: directory
        mode: "0755"

    - name: Shairportsync systemd override for PulseAudio
      ansible.builtin.copy:
        src: config/shairport-override.conf
        dest: /etc/systemd/system/shairport-sync.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart shairport-sync

    - name: Make sure shairport-sync is running
      ansible.builtin.systemd:
        state: started
        enabled: true
        name: shairport-sync
        daemon_reload: true

    - name: Disable WiFi Powermanagement
      ansible.builtin.copy:
        src: config/power.conf
        dest: /etc/NetworkManager/conf.d/power.conf
        owner: root
        group: root
        mode: "0644"
      register: powerman
      notify: Restart networking

    - name: Normalize audio at night
      ansible.builtin.cron:
        name: Normalize audio at night
        minute: "0"
        hour: 21-23,0-8
        job: /usr/bin/pactl set-default-sink night_normalize_sink
        user: pi

    - name: Use unfiltered ALSA output during the day
      ansible.builtin.cron:
        name: Use unfiltered ALSA output during the day
        minute: "0"
        hour: 9-20
        job: "/usr/bin/pactl set-default-sink {{ pipewire_output_node }}"
        user: pi

  handlers:
    - name: Restart shairport-sync
      ansible.builtin.systemd:
        state: restarted
        enabled: true
        daemon_reload: true
        name: shairport-sync

    - name: Restart pipewire filter chain
      ansible.builtin.systemd:
        state: restarted
        enabled: true
        daemon_reload: true
        name: pipewire-filter-chain

    - name: Restart wireplumber
      ansible.builtin.systemd:
        state: restarted
        enabled: true
        daemon_reload: true
        name: wireplumber-system

    - name: Restart networking
      ansible.builtin.systemd:
        state: restarted
        enabled: true
        name: NetworkManager
